spring:
  application:
    name: java-spring-boot-core
  messages:
    basename: messages/messages
    fallback-to-system-locale: false

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  structured:
    format:
      console: ecs

app:
  locale:
    default-locale: en
    supported-locales: en, hu

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
