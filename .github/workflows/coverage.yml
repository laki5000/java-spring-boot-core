name: Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: backend-build
          path: backend/target

      - name: Download unit test coverage
        uses: actions/download-artifact@v5
        with:
          name: unit-test-jacoco
          path: backend/target/coverage/unit

      - name: Download integration test coverage
        uses: actions/download-artifact@v5
        with:
          name: integration-test-jacoco
          path: backend/target/coverage/integration

      - name: Merge JaCoCo execution data
        working-directory: backend
        run: |
          mvn dependency:get \
            -Dartifact=org.jacoco:org.jacoco.cli:0.8.15:jar:nodeps \
            -Dtransitive=false

          java -jar ~/.m2/repository/org/jacoco/org.jacoco.cli/0.8.15/org.jacoco.cli-0.8.15-nodeps.jar \
            merge \
            target/coverage/unit/jacoco.exec \
            target/coverage/integration/jacoco.exec \
            --destfile target/jacoco-merged.exec

      - name: Generate JaCoCo report
        working-directory: backend
        run: mvn jacoco:report -Djacoco.dataFile=target/jacoco-merged.exec

      - name: Check coverage
        working-directory: backend
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("target/site/jacoco/jacoco.xml")
          counter = next(
              counter
              for counter in report.getroot().findall("counter")
              if counter.attrib["type"] == "INSTRUCTION"
          )

          missed = int(counter.attrib["missed"])
          covered = int(counter.attrib["covered"])
          ratio = covered / (missed + covered)

          print(f"Instruction coverage: {ratio:.2%}")

          if ratio < 0.90:
              raise SystemExit("Coverage is below 90%")
          PY