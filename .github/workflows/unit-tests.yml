name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/target

      - name: Run unit tests
        working-directory: backend
        run: ./mvnw -B jacoco:prepare-agent surefire:test -Punit-tests

      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-jacoco
          path: backend/target/jacoco.exec