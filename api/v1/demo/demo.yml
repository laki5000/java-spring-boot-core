get:
  tags: [demo]
  operationId: getDemo
  summary: Get demo message

  parameters:
    - name: error
      in: query
      required: false
      schema:
        type: boolean
        default: false

  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../components/schemas/demo-response.yml'

    '400':
      $ref: '../components/responses/bad-request.yml'

    '422':
      description: Demo error was requested
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/problem-detail.yml'

    '500':
      $ref: '../components/responses/internal-server-error.yml'